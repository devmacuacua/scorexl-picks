name: Dados Sportmonks (futebol)

on:
  # Sem horário automático até o Francisco pôr o secret SPORTMONKS_TOKEN e confirmar a 1.ª recolha.
  # Depois, descomentar: 06h17 e 08h17 de Maputo (a tarefa de futebol corre às 08h54).
  # schedule:
  #   - cron: "17 4,6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Data AAAA-MM-DD (vazio = hoje em Maputo)"
        required: false
      debug:
        description: "true = teste: grava em data/football/sportmonks_test/ + respostas brutas em data/football/raw/"
        required: false

permissions:
  contents: write

concurrency:
  group: sportmonks
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recolher dados
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then ARGS="$ARGS --debug"; fi
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then ARGS="$ARGS --test"; fi
          python scripts/fetch_sportmonks.py $ARGS
      - name: Publicar
        run: |
          git config user.name "scorexl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sem alterações"; exit 0; fi
          git commit -m "Dados Sportmonks $(TZ=Africa/Maputo date +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
