name: Dados api-sports

on:
  schedule:
    # De 2 em 2 horas (minuto 17 para fugir à hora certa, quando o GitHub mais atrasa):
    # 00h17, 02h17, ..., 22h17 Maputo. Só NBA (~11 pedidos por recolha): o futebol saiu
    # em 27/11/2026, quando a subscrição API-Football terminou (passa para a Sportmonks).
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Data AAAA-MM-DD (vazio = hoje em Maputo)"
        required: false
      only:
        description: "Lista por vírgulas: nba, football, basket (todas as ligas), euroleague, eurocup, nbl, bleague, cba, acb, bsl, gbl, aba, leagues-index. Vazio = nba"
        required: false

permissions:
  contents: write

concurrency:
  group: apisports
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recolher dados
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          python scripts/fetch_apisports.py $ARGS
      - name: Publicar
        run: |
          git config user.name "scorexl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sem alterações"; exit 0; fi
          git commit -m "Dados api-sports $(TZ=Africa/Maputo date +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
